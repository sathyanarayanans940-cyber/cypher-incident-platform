name: cypher

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "2"

services:
  postgres:
    <<: *runtime
    mem_limit: 100m
    command: ["postgres", "-c", "shared_buffers=24MB", "-c", "work_mem=1MB", "-c", "max_connections=20", "-c", "maintenance_work_mem=16MB"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cypher}
      POSTGRES_USER: ${POSTGRES_USER:-cypher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cypher_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cypher} -d ${POSTGRES_DB:-cypher}"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    <<: *runtime
    mem_limit: 320m
    build: ./services/gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cypher}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cypher}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cypher_dev_password}
      CYPHER_JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret-at-least-32-characters}
      CYPHER_SERVICE_API_KEY: ${SERVICE_API_KEY:-cypher-internal-dev-key}
      JAVA_TOOL_OPTIONS: -Xms48m -Xmx160m -XX:MaxMetaspaceSize=100m -XX:ReservedCodeCacheSize=32m -XX:+UseSerialGC -Xss256k
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15

  ai-engine:
    <<: *runtime
    mem_limit: 100m
    build: ./services/ai-engine
    environment:
      GATEWAY_URL: http://gateway:8080
      SERVICE_API_KEY: ${SERVICE_API_KEY:-cypher-internal-dev-key}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "5000:5000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  reporting:
    <<: *runtime
    profiles: ["reporting"]
    mem_limit: 140m
    build: ./services/reporting
    environment:
      ConnectionStrings__Cypher: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cypher};Username=${POSTGRES_USER:-cypher};Password=${POSTGRES_PASSWORD:-cypher_dev_password}
      REPORTING_POLL_SECONDS: 5
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    <<: *runtime
    mem_limit: 24m
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
      ai-engine:
        condition: service_healthy

  prometheus:
    <<: *runtime
    profiles: ["observability"]
    mem_limit: 100m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d", "--storage.tsdb.retention.size=100MB"]
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
      - ai-engine

  grafana:
    <<: *runtime
    profiles: ["observability"]
    mem_limit: 140m
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  jenkins:
    <<: *runtime
    image: jenkins/jenkins:lts-jdk17
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
    profiles: ["devops"]

volumes:
  postgres-data:
  grafana-data:
  jenkins-data:
