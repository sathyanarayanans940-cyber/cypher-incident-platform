server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 256k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  gzip on;
  gzip_types text/css application/javascript application/json;

  location /api/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ai/ {
    set $engine http://ai-engine:5000;
    rewrite ^/ai/(.*)$ /$1 break;
    proxy_pass $engine;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /reports/ {
    set $reporting http://reporting:5001;
    rewrite ^/reports/(.*)$ /api/reports/$1 break;
    proxy_pass $reporting;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws {
    set $gateway_ws http://gateway:8080;
    proxy_pass $gateway_ws$request_uri;
    proxy_read_timeout 3600s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
